name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (PANDORA = Xiaomi 17 Pro, 4 KiB pages; FUXI / SWEET also build)
        default: PANDORA
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      iig_replay:
        description: DriverKit iig outputs replayed from xnu/iig-pregen
        default: "1"
  # no push trigger: every run is started by hand (private-repo macOS minutes are limited)

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'PANDORA' }}
  # iig replay (macos-14 retirement)
  # iig is the ONLY Xcode-version-bound tool: DriverKit's iig turns iokit/DriverKit/*.iig
  # into *.h + *.iig.cpp. Xcode 16+ emits IORPC.kernelContent, which xnu-8796 rejects.
  # These 17 pairs were generated by Xcode 15.4 (iig DriverKit-286) and are byte-identical
  # to what a macos-14 Xcode 15 build produced (ios-fuxi capture run 41098982212).
  XNU_IIG_CACHE: ${{ github.workspace }}/xnu/iig-pregen

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # The staging scripts only run for SWEET; FUXI and PANDORA use the same staged sources
          sed -i '' 's/\[\[ "\${MACHINE_CONFIG:-}" == SWEET \]\]/[[ "${MACHINE_CONFIG:-}" =~ ^(SWEET|FUXI|PANDORA)$ ]]/' dxb/patches/*.sh
          grep -h 'MACHINE_CONFIG:-' dxb/patches/*.sh
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Verify iig replay cache
        run: |
          chmod +x xnu-iig-cache.py
          python3 xnu-iig-cache.py --verify "$XNU_DIR" "$XNU_IIG_CACHE"
          # prove the replay tool parses the exact flags xnu's Makefile passes
          head -1 "$IIG"; grep -n 'replay' "$IIG" | head -3
        env:
          XNU_DIR: ${{ github.workspace }}/xnu
          XNU_IIG_CACHE: ${{ github.workspace }}/xnu/iig-pregen
          IIG: ${{ github.workspace }}/xnu-iig-cache.py

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
          # iig replay: never run Xcode's iig (version-bound); use the Xcode 15.4 outputs.
          # xnu's iokit/DriverKit/Makefile calls '$(IIG) --def ... --header ... --impl ...',
          # so an overriding IIG makes Apple's iig unreachable; xnu-iig-cache.py copies the
          # cached pair instead and verifies every .iig input hash.
          IIG: ${{ github.workspace }}/xnu-iig-cache.py
          XNU_IIG_CACHE: ${{ github.workspace }}/xnu/iig-pregen
          # belt and braces: fail the run loudly if anything reaches Apple's iig anyway
          IIG_MUST_NOT_RUN: "1"
        run: |
          bash build.sh
          # after the build: every DriverKit .iig must have produced the cached header,
          # and no generated file may carry a DriverKit-4xx (Xcode 16) stamp.
          echo "== iig output check"
          find . -name '*.iig.cpp' -newermt '-2 hours' | head -20
          if grep -rl 'DriverKit-4' --include='*.h' build 2>/dev/null | head -5 | grep -q .; then
            echo "::error::Xcode-16 iig output detected (IORPC.kernelContent); replay did not take effect"
            exit 1
          fi
          echo "iig replay OK"

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Package objects for local relinks
        if: always()
        run: |
          # Every object, file list and export list of the kernel link, plus the two link
          # libraries that only Xcode/blacktop have: wsl/local_relink.sh recompiles changed
          # files and relinks with cctools-port ld64 on Linux.
          O=dxb/build/xnu.obj
          mkdir -p linklibs
          cp dxb/fakeroot/usr/local/lib/kernel/libfirehose_kernel.a linklibs/ || true
          TC=$(dirname "$(xcrun --find clang)")/..
          find "$TC" "$(xcrun --sdk macosx --show-sdk-path)" -name '*cc_kext*' 2>/dev/null | tee linklibs/cc_kext_paths.txt
          while read -r f; do cp "$f" linklibs/ || true; done < linklibs/cc_kext_paths.txt
          (cd $O && find . -type f \( -name '*.o' -o -name '*.cpo' -o -name '*.filelist' -o -name '*.exp' -o -name 'symbolsets.plist' \)) > objlist.txt
          wc -l objlist.txt
          tar czf objects.tgz -C $O -T objlist.txt
          tar czf linklibs.tgz linklibs
          ls -la objects.tgz linklibs.tgz linklibs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-objects
          path: |
            objects.tgz
            linklibs.tgz
          retention-days: 7

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
